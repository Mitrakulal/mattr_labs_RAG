<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mattrlabs RAG Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>mattrlabs</h1>
            <p>Ask anything about the studio</p>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message bot">
                Hello! Ask me about mattrlabs — products, 3D printing, the studio, or anything else.
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="Ask a question..." autofocus>
            <button id="sendBtn">Send</button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
